# These macros do not heat automatically. This prevents an accidental load or
# unload operation from selecting an unsuitable material temperature.

[gcode_macro CANCEL_PRINT]
description: Cancel the print and leave heaters and fan off
rename_existing: BASE_CANCEL_PRINT
gcode:
  TURN_OFF_HEATERS
  M107
  BASE_CANCEL_PRINT

[gcode_macro LOAD_FILAMENT]
description: Load filament after the hotend has been heated explicitly
gcode:
  {% if printer.extruder.can_extrude %}
    SAVE_GCODE_STATE NAME=E3V3SE_LOAD_FILAMENT
    M83
    G92 E0
    G1 E40 F300
    RESTORE_GCODE_STATE NAME=E3V3SE_LOAD_FILAMENT
  {% else %}
    {action_raise_error("Heat the hotend before loading filament")}
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament after the hotend has been heated explicitly
gcode:
  {% if printer.extruder.can_extrude %}
    SAVE_GCODE_STATE NAME=E3V3SE_UNLOAD_FILAMENT
    M83
    G92 E0
    G1 E-40 F300
    RESTORE_GCODE_STATE NAME=E3V3SE_UNLOAD_FILAMENT
  {% else %}
    {action_raise_error("Heat the hotend before unloading filament")}
  {% endif %}
